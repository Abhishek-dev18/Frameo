<!doctype html>
<!--
  Debug Diaries #024 "The Listener That Never Left" (Series, troubleshooting format), built in HyperFrames.
  Topic: a Node API crashes with "heap out of memory" every few hours; memory climbs under load and never comes down.
  Bug type: MEMORY LEAK / event listener leak. bus.on('update', () => refresh(req)) inside the request handler adds a
  new listener per request and never removes it; each closure keeps its req alive, so GC can't free it.
  Clue: Node's MaxListenersExceededWarning ("Possible EventEmitter memory leak detected. 11 update listeners added").
  Fix: subscribe once at startup (or pair every on() with off()). Verified in Node: 1000 requests -> 1000 listeners
  (buggy) vs 1 (fixed), and the warning text fires at the 11th listener.
  Story: symptom → reproduce (load test, heap never drops; "more RAM?" struck out) → logs (warning) → root cause
  → fix (diff + listener count + flat memory) → lesson (on ↔ off). Voice: content/debug-diaries/024 (Sarvam, 6 parts,
  calm defaults). App, command, heap numbers and logs (apart from Node's warning wording) are illustrative.
-->
