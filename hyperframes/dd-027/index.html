<!--
  Debug Diaries #027 "One Typo" (Series, FAMOUS incident told as a debugging story), built in HyperFrames.
  Incident: Amazon S3 outage, AWS US-EAST-1 (Northern Virginia), 28 Feb 2017, ~9:37 AM to 1:54 PM PST (~4 h).
  While debugging slow S3 billing, an authorized engineer ran an established playbook command to remove a small number of
  servers; one input was entered incorrectly, removing a much larger set, including servers of the index and placement
  subsystems. Both needed a full restart (not done in larger regions for years), which took hours. The AWS Service Health
  Dashboard could not be updated (its admin console depended on S3); updates went out on Twitter. Sites such as Slack,
  Trello, Quora were affected (press). Fix: tool removes capacity slowly and refuses to take a subsystem below its
  minimum required capacity (AWS also partitioned the index into cells).
  Bug type: HUMAN ERROR / FAT-FINGER INPUT + MISSING SAFETY GUARDRAIL (blast radius). Lesson: build guardrails.
  On-screen log, command and fix code are illustrative/simplified (fix verified: remove(n) refused below minimum).
  Sources: AWS "Summary of the Amazon S3 Service Disruption in the Northern Virginia (US-EAST-1) Region"
  (aws.amazon.com/message/41926); InfoQ (Mar 2017); eWeek (Feb 2017).
  Voice: content/debug-diaries/027 (Sarvam, 6 parts, calm defaults).
-->
