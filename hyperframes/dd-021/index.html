<!--
  Debug Diaries #021 "Same Post Twice" (Series, troubleshooting format), built in HyperFrames.
  Topic: infinite-scroll feed shows the same post twice when a new post is inserted between page loads.
  Bug type: PAGINATION / offset drift on changing data. LIMIT 3 OFFSET 3 counts positions; a new post on top shifts
  everything down one slot, so page 2 starts with page 1's last post. Fix: cursor (keyset) pagination,
  WHERE id < :cursor ORDER BY id DESC LIMIT 3. Verified in Node with ids 10..1 + new 11: offset page2 [8,7,6],
  cursor page2 [7,6,5].
  Story: symptom → reproduce (insert mid-scroll) → logs (8 = 8) → root cause (slots shift) → fix (diff) → lesson.
  Voice: content/debug-diaries/021 (Sarvam, 6 parts, tighten.py calm defaults). Feed, ids and logs are illustrative.
-->
