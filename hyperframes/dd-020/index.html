<!doctype html>
<!--
  Debug Diaries #020 "Half an Emoji" (Series, troubleshooting format), built in HyperFrames.
  Topic: push-notification preview shows a broken "?" box for names with emoji.
  Bug type: CHARACTER ENCODING / UTF-16 surrogate pairs. name.slice(0, 6) counts UTF-16 code units, so it cut 🎉
  (two units, \uD83C\uDF89) in half and left a lone surrogate. Fix: Array.from(name).slice(0, 6).join("") (code points)
  or Intl.Segmenter with granularity "grapheme" (family emoji 👨‍👩‍👧: .length 8, Array.from 5, Segmenter 1).
  Story: symptom → reproduce (English fine, emoji breaks) → logs (len=6, "\ud83c") → root cause → fix (diff) → lesson.
  Voice: content/debug-diaries/020 (Sarvam, 6 parts, tighten.py). Names and logs are illustrative.
-->
