<!--
  Debug Diaries #022 "The False That Was True" (Series, troubleshooting format), built in HyperFrames.
  Topic: right after a deploy the whole site shows "Down for maintenance" although the dashboard flag says false.
  Bug type: ENV / CONFIG type mismatch. Environment variables are always strings; if (process.env.MAINTENANCE_MODE)
  treats "false" as truthy (any non-empty string is truthy). Locally the variable was unset (undefined), so it hid.
  Fix: compare explicitly (=== "true") and parse + validate config once at startup (fail fast on bad values).
  Verified in Node: MAINTENANCE_MODE=false -> bug branch taken, typeof "string"; fixed check -> normal; "flase" -> throws.
  Story: symptom → reproduce (local fine, staging down) → logs (quotes around "false") → root cause (truthy string)
  → fix (diff + validate at boot) → lesson (PARSE). Voice: content/debug-diaries/022 (Sarvam, 6 parts, calm defaults).
  App, URLs, config and logs are illustrative.
-->
