<!--
  Debug Diaries #029 "One Setting" (Series, FAMOUS incident told as a debugging story), built in HyperFrames.
  Incident: Fastly global CDN outage, 8 Jun 2021 (onset 09:47 UTC). A software deployment begun 12 May 2021 introduced a
  bug triggerable by a specific customer configuration under specific circumstances; early 8 June a customer pushed a
  VALID configuration change that triggered it and 85% of Fastly's network returned errors. Detected within 1 minute
  (09:48), config identified 10:27, config disabled; within 49 minutes 95% of the network was normal; mitigated 12:35;
  permanent bug fix rollout began 17:25 UTC. Affected sites (NPR): New York Times, Guardian, Twitch, Reddit, GOV.UK, CNN.
  Bug type: LATENT BUG / untested code path triggered by valid input (config-driven), blast radius. Lesson: valid input
  can still crash a system; detect fast and roll back fast.
  On-screen code and config diff are illustrative/simplified, not Fastly's code (latent-path code verified with node).
  Sources: Fastly blog "Summary of June 8 outage" (fastly.com/blog/summary-of-june-8-outage, Nick Rockwell);
  NPR 9 Jun 2021; The Register 9 Jun 2021.
  Voice: content/debug-diaries/029 (Sarvam, 6 parts, calm defaults).
