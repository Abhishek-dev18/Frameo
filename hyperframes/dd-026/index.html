<!--
  Debug Diaries #026 "Wrong Server" (Series, FAMOUS incident told as a debugging story), built in HyperFrames.
  Incident: GitLab.com database outage, 31 Jan 2017. Spam load -> secondary (db2) fell behind in replication; during a
  late-night manual re-sync an engineer wiped the PostgreSQL data directory on the PRIMARY (db1) instead of db2; ~300 GB
  removed before it was stopped. GitLab.com down ~18 h; ~6 h of DB changes lost (~5,000 projects, ~5,000 comments,
  ~700 new users; git repos/wikis safe). Backups failed: pg_dump 9.2 vs DB 9.6 errored, cron failure emails rejected
  (DMARC), S3 bucket empty, Azure disk snapshots not enabled for DB servers. Restored from a staging LVM snapshot taken
  manually ~6 h earlier; slow (~60 Mbps) disks made the copy take ~18 h.
  Bug type: HUMAN ERROR / WRONG HOST + UNTESTED BACKUPS (disaster recovery). Lesson: test the restore.
  On-screen commands/diff are simplified (verified: a failing `cmd > backup.sql` exits 1 and leaves a 0-byte file).
  Sources: GitLab "Postmortem of database outage of January 31" (about.gitlab.com, 10 Feb 2017); GitLab incident blog
  (1 Feb 2017); The Register (1 Feb 2017).
  Voice: content/debug-diaries/026 (Sarvam, 6 parts, calm defaults).
-->
